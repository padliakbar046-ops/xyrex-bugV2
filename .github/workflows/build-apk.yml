name: Build XYREX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare Gradle Project
      run: |
        cd apk-wrapper
        
        # Set lokasi SDK
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # Buat file build.gradle (versi stabil 8.7)
        cat > build.gradle <<'GRADLE'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.7.0'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        GRADLE

        # Buat file settings.gradle
        cat > settings.gradle <<'GRADLE'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "XYREX"
        include ':app'
        GRADLE

        # Buat file app/build.gradle
        mkdir -p app
        cat > app/build.gradle <<'GRADLE'
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.xyrex.app'
            compileSdk 34
            buildToolsVersion "34.0.0"
            defaultConfig {
                applicationId "com.xyrex.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        GRADLE

        # Copy file java dan manifest ke folder app
        mkdir -p app/src/main/java/com/xyrex/app
        mkdir -p app/src/main
        cp java/com/xyrex/app/MainActivity.java app/src/main/java/com/xyrex/app/
        cp AndroidManifest.xml app/src/main/

        # Setup gradle wrapper
        gradle wrapper --gradle-version 8.7

    - name: Build APK
      run: |
        cd apk-wrapper
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XYREX-App
        path: apk-wrapper/app/build/outputs/apk/debug/app-debug.apk
